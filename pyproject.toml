[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
# stages/ holds archived course scripts kept as they were; lint only the reproducible pipeline
include = ["run_analysis.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
